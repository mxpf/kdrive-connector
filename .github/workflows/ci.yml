name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            remote/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Test
        run: npm test

      - name: Set up Python for synthetic PDF interoperability tests
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Test independent HTTP clients and PDF extraction
        run: |
          python3 -m pip install -r test/integration/requirements.txt
          npm run test:pdf

      - name: Build
        run: npm run build

      - name: Install remote server dependencies
        run: npm ci
        working-directory: remote

      - name: Type-check remote server
        run: npm run type-check
        working-directory: remote

      - name: Test remote server
        run: npm test
        working-directory: remote

      - name: Test Worker HTTP binary delivery
        run: npm run test:http
        working-directory: remote
